name: probe-school-sources
on:
  push:
    branches: ["claude/uk-schools-map"]
    paths: ["scripts/probe_sources.py", ".github/workflows/probe-sources.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_sources.py
