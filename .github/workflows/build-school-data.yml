name: Build school data

# Runs only when started by hand (Actions tab > Build school data > Run workflow)
# or when the build script itself changes on main.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "What to rebuild"
        type: choice
        default: all
        options: [all, schools, catchments]
  push:
    branches: [main]
    paths:
      - scripts/build_school_data.py
      - scripts/build_catchments.py
      - scripts/catchment_sources/**

permissions:
  contents: write

concurrency:
  group: build-school-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyproj==3.7.1 pdfplumber==0.11.4 openpyxl==3.1.5 python-docx==1.1.2 xlrd==2.0.1
      - name: Build school data
        if: github.event_name != 'workflow_dispatch' || inputs.part != 'catchments'
        run: python3 scripts/build_school_data.py
      - name: Collect London cut-off distances from council sites
        if: github.event_name != 'workflow_dispatch' || inputs.part != 'schools'
        # Council sites are slow and change often: never let this step block the school data commit.
        timeout-minutes: 25
        continue-on-error: true
        run: python3 scripts/build_catchments.py --region london
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schools/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update school data ($(date -u +%Y-%m-%d))"
          git push
