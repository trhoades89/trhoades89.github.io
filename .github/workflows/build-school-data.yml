name: Build school data

# Runs only when started by hand (Actions tab > Build school data > Run workflow)
# or when the build script itself changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_school_data.py

permissions:
  contents: write

concurrency:
  group: build-school-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyproj==3.7.1
      - name: Build
        run: python3 scripts/build_school_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schools/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update school data ($(date -u +%Y-%m-%d))"
          git push
